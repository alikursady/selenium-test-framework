name: ui-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        suite: [testng.xml, testng-serial.xml]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Report the Chrome version under test
        run: google-chrome --version

      - name: Run the suite
        env:
          BROWSER: chrome
          HEADLESS: 'true'
        run: mvn -B test -DsuiteFile=${{ matrix.suite }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ strategy.job-index }}
          path: target/allure-results
          if-no-files-found: error
          retention-days: 14

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ strategy.job-index }}
          path: target/surefire-reports
          retention-days: 14

