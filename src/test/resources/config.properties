browser=chrome
headless=true

# Two hosts because no single demo site covers every scenario I wanted:
# saucedemo has a real login and cart flow, the-internet has the awkward
# DOM cases (delayed elements, iframes, native dialogs).
saucedemo.url=https://www.saucedemo.com
internet.url=https://the-internet.herokuapp.com

explicit.wait.seconds=10
page.load.timeout.seconds=30

standard.user=standard_user
locked.user=locked_out_user
valid.password=secret_sauce
